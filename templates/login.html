{% extends "layout.html" %}

{% block title %}Log In - Smart Recipe Assistant{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Log In to use SmartRecipe Assistant</p>
    </div>

    <!-- Dynamic Error Alert -->
    <div id="login-alert" class="alert alert-error hidden" role="alert">
      <span class="alert-icon-svg">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
        </svg>
      </span>
      <span id="login-alert-text" class="alert-message"></span>
    </div>

    <form id="login-form" class="auth-form" novalidate>
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-control" 
          placeholder="Enter the registered email id" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="password-input-group">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="enter password" 
            required 
            autocomplete="current-password"
          >
          <button type="button" class="password-toggle-btn" id="toggle-password" aria-label="Toggle password visibility">
            <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
            <svg class="eye-on-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg">
        <span class="btn-text">Log In</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a href="/signup" class="auth-link">Sign up</a></p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const form = document.getElementById('login-form');
  const alertBox = document.getElementById('login-alert');
  const alertText = document.getElementById('login-alert-text');
  const submitBtn = document.getElementById('login-submit-btn');

  // Password toggle
  const togglePassword = document.getElementById('toggle-password');
  const passwordInput = document.getElementById('password');
  if (togglePassword && passwordInput) {
    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      const eyeOff = togglePassword.querySelector('.eye-off-icon');
      const eyeOn = togglePassword.querySelector('.eye-on-icon');
      if (eyeOff && eyeOn) {
        eyeOff.classList.toggle('hidden', isPassword);
        eyeOn.classList.toggle('hidden', !isPassword);
      }
    });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.classList.add('hidden');

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      alertText.textContent = 'Please provide both your email and password.';
      alertBox.classList.remove('hidden');
      return;
    }

    try {
      submitBtn.disabled = true;
      submitBtn.querySelector('.btn-text').textContent = 'Logging in...';

      const response = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const result = await response.json();

      if (response.ok && result.success) {
        showToast('Logged in successfully! Welcome back.', 'success');
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 600);
      } else {
        alertText.textContent = result.error || 'Invalid email or password.';
        alertBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.querySelector('.btn-text').textContent = 'Log In';
      }
    } catch (err) {
      alertText.textContent = 'Connection error. Please try again.';
      alertBox.classList.remove('hidden');
      submitBtn.disabled = false;
      submitBtn.querySelector('.btn-text').textContent = 'Log In';
    }
  });
</script>
{% endblock %}
