{% extends "layout.html" %}

{% block title %}Sign Up - Smart Recipe Assistant{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">Create an Account</h1>
    </div>

    <!-- Dynamic Error Alert -->
    <div id="signup-alert" class="alert alert-error hidden" role="alert">
      <span class="alert-icon-svg">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
        </svg>
      </span>
      <span id="signup-alert-text" class="alert-message"></span>
    </div>

    <form id="signup-form" class="auth-form" novalidate>
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          class="form-control" 
          placeholder="Enter your name here" 
          required 
          minlength="2" 
          maxlength="100"
          autocomplete="name"
        >
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-control" 
          placeholder="Enter your email here" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="password-input-group">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="Please create password" 
            required 
            minlength="8"
            autocomplete="new-password"
          >
          <button type="button" class="password-toggle-btn" id="toggle-password" aria-label="Toggle password visibility">
            <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
            <svg class="eye-on-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <small class="form-hint">Must be at least 8 characters long.</small>
      </div>

      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <div class="password-input-group">
          <input 
            type="password" 
            id="confirm_password" 
            name="confirm_password" 
            class="form-control" 
            placeholder="Enter password again" 
            required 
            autocomplete="new-password"
          >
          <button type="button" class="password-toggle-btn" id="toggle-confirm-password" aria-label="Toggle confirm password visibility">
            <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
            <svg class="eye-on-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="signup-submit-btn" class="btn btn-primary btn-block btn-lg">
        <span class="btn-text">Create Account</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a href="/login" class="auth-link">Log in</a></p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const form = document.getElementById('signup-form');
  const alertBox = document.getElementById('signup-alert');
  const alertText = document.getElementById('signup-alert-text');
  const submitBtn = document.getElementById('signup-submit-btn');

  // Helper for password eye toggles
  function setupEyeToggle(toggleBtnId, inputId) {
    const toggleBtn = document.getElementById(toggleBtnId);
    const inputField = document.getElementById(inputId);
    if (toggleBtn && inputField) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = inputField.getAttribute('type') === 'password';
        inputField.setAttribute('type', isPassword ? 'text' : 'password');
        const eyeOff = toggleBtn.querySelector('.eye-off-icon');
        const eyeOn = toggleBtn.querySelector('.eye-on-icon');
        if (eyeOff && eyeOn) {
          eyeOff.classList.toggle('hidden', isPassword);
          eyeOn.classList.toggle('hidden', !isPassword);
        }
      });
    }
  }

  setupEyeToggle('toggle-password', 'password');
  setupEyeToggle('toggle-confirm-password', 'confirm_password');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.classList.add('hidden');

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;

    if (!name || name.length < 2) {
      alertText.textContent = 'Name must be between 2 and 100 characters.';
      alertBox.classList.remove('hidden');
      return;
    }

    const emailPattern = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
    if (!emailPattern.test(email)) {
      alertText.textContent = 'Please enter a valid email address.';
      alertBox.classList.remove('hidden');
      return;
    }

    if (password.length < 8) {
      alertText.textContent = 'Password must be at least 8 characters long.';
      alertBox.classList.remove('hidden');
      return;
    }

    if (password !== confirmPassword) {
      alertText.textContent = 'Passwords do not match.';
      alertBox.classList.remove('hidden');
      return;
    }

    try {
      submitBtn.disabled = true;
      submitBtn.querySelector('.btn-text').textContent = 'Creating account...';

      const response = await fetch('/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });

      const result = await response.json();

      if (response.ok && result.success) {
        showToast('Account created! Logging you in...', 'success');
        
        // Auto log in after successful signup
        const loginRes = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const loginData = await loginRes.json();
        if (loginRes.ok && loginData.success) {
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 600);
        } else {
          window.location.href = '/login';
        }
      } else {
        alertText.textContent = result.error || 'Failed to create account. Please try again.';
        alertBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.querySelector('.btn-text').textContent = 'Create Account';
      }
    } catch (err) {
      alertText.textContent = 'Connection error. Please try again.';
      alertBox.classList.remove('hidden');
      submitBtn.disabled = false;
      submitBtn.querySelector('.btn-text').textContent = 'Create Account';
    }
  });
</script>
{% endblock %}
